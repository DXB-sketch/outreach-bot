[project]
name = "outreach-bot"
version = "0.1.0"
description = "Find, audit, score and draft outreach to local businesses that need a better website."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.45"]

[project.scripts]
outreach = "outreach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["outreach*"]
